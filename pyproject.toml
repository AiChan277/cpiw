[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privacycam"
version = "0.1.0"
description = "Real-time face anonymization with Intel NPU acceleration"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Rachel"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openvino>=2024.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "PySide6>=6.5.0",
    "pyvirtualcam>=0.10.0",
    "PyYAML>=6.0",
    "click>=8.1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.5.0",
]

[project.scripts]
privacycam = "privacycam.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/privacycam"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
